<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>English with Marta · Angol Martával</title>
<meta name="description" content="A calm, personal English course for Marta. Local-first, private, offline.">
<style>
/* Base design system — warm, adult, calm. Designed for a 70+ learner. */
:root{
  /* Direction C — "Rustig & modern": off-white ground, one deep teal accent, soft blush support */
  --bg:#f5f6f4;            /* soft off-white with a faint green bias */
  --surface:#ffffff;
  --surface-2:#eef1ee;
  --ink:#20241f;           /* deep readable ink */
  --ink-soft:#5b615a;
  --accent:#14746f;        /* deep calm teal */
  --accent-ink:#ffffff;
  --accent-soft:#eaf4f3;   /* teal tint for chips/icon wells */
  --accent-2:#c06a4a;      /* warm clay support (used sparingly) */
  --blush:#e7b6a0;
  --line:#e3e6e2;
  --good:#14746f;
  --good-bg:#e7f1f0;
  --gentle:#9a6a2b;
  --gentle-bg:#f6eede;
  --focus:#14746f;
  --radius:18px;
  --shadow:0 10px 30px -18px rgba(20,60,58,.45);
  --shadow-soft:0 2px 10px rgba(30,50,45,.06);
  --tap:48px;
  --font: ui-sans-serif, system-ui, "Segoe UI", "Helvetica Neue", "Avenir Next", Roboto, Arial, sans-serif;
  --fs:20px;
}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  line-height:1.6;font-size:1rem;-webkit-text-size-adjust:100%;
}
body[data-textsize="large"]{--fs:23px}
body[data-textsize="xlarge"]{--fs:26px}
body[data-motion="reduce"] *{animation:none !important;transition:none !important}
h1,h2,h3{line-height:1.25;color:var(--ink);margin:0 0 .5rem}
h1{font-size:1.7rem}h2{font-size:1.35rem}h3{font-size:1.15rem}
p{margin:0 0 .8rem}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
button{font-family:inherit}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.container{max-width:920px;margin:0 auto;padding:1rem 1.1rem 4rem}
.hidden{display:none !important}

/* Buttons — always large, always labelled */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  min-height:var(--tap);padding:.7rem 1.3rem;border-radius:12px;
  border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);
  font-size:1.02rem;font-weight:600;cursor:pointer;text-decoration:none;
}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(1px)}
.btn.secondary{background:var(--surface);color:var(--accent);}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.wide{width:100%}
.btn.small{min-height:40px;padding:.4rem .9rem;font-size:.92rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:.7rem;margin:1rem 0}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow-soft);padding:1.4rem;margin:0 0 1.1rem}
.card.raised{box-shadow:var(--shadow)}
.card h2{margin-top:0}
.muted{color:var(--ink-soft)}
.pill{display:inline-block;padding:.2rem .7rem;border-radius:999px;background:var(--surface-2);
  font-size:.82rem;color:var(--ink-soft);border:1px solid var(--line)}

/* Header / navigation */
.appbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:.8rem;padding:.6rem 1rem}
.appbar .brand{display:flex;align-items:center;gap:.6rem;font-weight:700}
.appbar .brand svg{width:40px;height:40px;flex:0 0 auto}
.appbar .spacer{flex:1}
.appbar nav{display:flex;gap:.3rem;flex-wrap:wrap}
.navbtn{min-height:44px;padding:.4rem .8rem;border-radius:10px;border:1px solid transparent;
  background:transparent;color:var(--ink);font-size:.95rem;cursor:pointer;font-weight:600}
.navbtn[aria-current="page"]{background:var(--good-bg);border-color:var(--accent);color:var(--accent)}
.navbtn:hover{background:var(--surface-2)}

/* Avatar */
.avatar{width:96px;height:96px;border-radius:50%;background:var(--surface-2);border:2px solid var(--line);flex:0 0 auto;overflow:hidden}
.avatar.small{width:52px;height:52px}
.avatar svg{width:100%;height:100%;display:block}
.avatar-row{display:flex;align-items:center;gap:1rem;margin-bottom:1rem}

/* Progress ring (conic-gradient, no colour-only meaning: always shows % text too) */
.ring{--p:0;--rs:64px;width:var(--rs);height:var(--rs);border-radius:50%;flex:0 0 auto;
  background:conic-gradient(var(--accent) calc(var(--p)*1%), var(--surface-2) 0);display:grid;place-items:center}
.ring > b{width:calc(var(--rs) - 14px);height:calc(var(--rs) - 14px);border-radius:50%;background:var(--surface);
  display:grid;place-items:center;font-weight:800;font-size:.9rem;color:var(--ink);font-variant-numeric:tabular-nums}
.ring.sm{--rs:44px}.ring.sm > b{font-size:.72rem}

/* Home hero */
.hero{display:flex;align-items:center;gap:1.1rem;margin:.2rem 0 1.2rem}
.hero .avatar{width:76px;height:76px}
.hero h1{margin:0;font-size:1.6rem;letter-spacing:-.01em}
.hero .sub{color:var(--ink-soft);margin:.2rem 0 0}
.recommend{background:linear-gradient(180deg,#ffffff, var(--accent-soft));border:1px solid var(--line);
  border-radius:var(--radius);padding:1.3rem;box-shadow:var(--shadow);margin-bottom:1.2rem}
.recommend .k{font-size:.74rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.recommend h2{margin:.2rem 0 .2rem;font-size:1.3rem}

/* Theme tiles (icon well + colour + optional ring) */
.tilegrid{display:grid;grid-template-columns:1fr;gap:.7rem}
@media(min-width:560px){.tilegrid{grid-template-columns:1fr 1fr}}
.themetile{display:flex;align-items:center;gap:.8rem;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:.9rem 1rem;cursor:pointer;text-align:left;color:var(--ink);width:100%}
.themetile:hover{border-color:var(--accent)}
.iconwell{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;flex:0 0 auto;
  background:var(--tint,var(--accent-soft));color:var(--tintink,var(--accent))}
.iconwell svg{width:24px;height:24px}
.themetile .txt{flex:1;min-width:0}
.themetile .txt b{display:block;font-size:1.02rem}
.themetile .txt span{font-size:.82rem;color:var(--ink-soft)}

/* Progress */
.progress{height:16px;background:var(--surface-2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.progress > span{display:block;height:100%;background:var(--accent);width:0}
.unit-list{list-style:none;padding:0;margin:0}
.unit{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:.8rem;overflow:hidden}
.unit > button{width:100%;text-align:left;background:transparent;border:0;padding:1rem 1.1rem;cursor:pointer;
  display:flex;align-items:center;gap:.8rem;font-size:1.05rem;font-weight:700;color:var(--ink)}
.unit .lessons{padding:.3rem .9rem 1rem}
.lessonbtn{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:.7rem .9rem;margin:.35rem 0;cursor:pointer;font-size:1rem;color:var(--ink)}
.lessonbtn:hover{background:var(--good-bg)}
.lessonbtn .done{color:var(--good);font-weight:700}
.badge-status{font-size:.78rem;padding:.15rem .55rem;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-soft)}

/* Activity area */
.stage{min-height:220px}
.prompt{font-size:1.15rem;font-weight:600;margin-bottom:1rem}
.wordcard{text-align:center;padding:1.4rem}
.wordcard .wordicon{width:64px;height:64px;margin:0 auto .6rem;border-radius:18px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.wordcard .wordicon svg{width:34px;height:34px}
.wordcard .en{font-size:2rem;font-weight:800;letter-spacing:.3px}
.stepbadge{display:inline-flex;align-items:center;gap:.4rem;font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:var(--accent);background:var(--accent-soft);border:1px solid var(--line);padding:.25rem .6rem;border-radius:999px;margin-bottom:.6rem}
.grammarbox{background:var(--accent-soft);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:.9rem 1rem;margin:1rem 0}
.grammarbox .lbl{font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:.25rem}
.grammarbox .eg{font-weight:600}
.wordcard .hu{font-size:1.15rem;color:var(--accent-2);margin-top:.3rem}
.wordcard .ex{margin-top:.8rem;color:var(--ink-soft)}
.options{display:grid;gap:.7rem;grid-template-columns:1fr}
.option{display:flex;align-items:center;gap:.7rem;min-height:var(--tap);padding:.8rem 1rem;border-radius:12px;
  border:2px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.05rem;text-align:left;color:var(--ink)}
.option:hover{border-color:var(--accent);background:var(--good-bg)}
.option.correct{border-color:var(--good);background:var(--good-bg)}
.option.wrong{border-color:var(--gentle);background:var(--gentle-bg)}
.option .mark{margin-left:auto;font-weight:800}
.blocks,.builder{display:flex;flex-wrap:wrap;gap:.5rem;margin:.6rem 0}
.block{min-height:44px;padding:.5rem 1rem;border-radius:10px;border:2px solid var(--accent);background:var(--surface);
  color:var(--ink);cursor:pointer;font-size:1.05rem}
.builder{min-height:56px;border:2px dashed var(--line);border-radius:12px;padding:.6rem;align-items:center}
.builder:empty::before{content:attr(data-empty);color:var(--ink-soft)}
.textin{width:100%;min-height:var(--tap);font-size:1.1rem;padding:.7rem .9rem;border:2px solid var(--line);border-radius:12px;
  background:var(--surface);color:var(--ink)}
.textin:focus{border-color:var(--accent)}

/* Feedback (also uses text + icon, never colour alone) */
.feedback{display:flex;align-items:flex-start;gap:.6rem;padding:.9rem 1rem;border-radius:12px;margin:1rem 0;font-size:1.05rem}
.feedback.good{background:var(--good-bg);border:1px solid var(--good);color:var(--ink)}
.feedback.gentle{background:var(--gentle-bg);border:1px solid var(--gentle);color:var(--ink)}
.feedback svg{flex:0 0 auto;margin-top:2px}

/* Help panel */
.helppanel{background:var(--gentle-bg);border:1px solid var(--gentle);border-radius:12px;padding:.9rem 1rem;margin:1rem 0}
.helppanel h3{color:var(--gentle);font-size:1rem;margin-bottom:.3rem}

/* Conversation — chat with character faces */
.chat{display:flex;flex-direction:column;gap:.8rem;margin:1rem 0}
.turn{display:flex;gap:.55rem;align-items:flex-end;max-width:90%}
.turn.them{align-self:flex-start}
.turn.me{align-self:flex-end;flex-direction:row-reverse}
.turn .face{width:40px;height:40px;border-radius:50%;overflow:hidden;flex:0 0 auto;border:1px solid var(--line);background:var(--surface-2)}
.turn .face svg{width:100%;height:100%;display:block}
.bubble{padding:.75rem 1rem;border-radius:16px;font-size:1.08rem}
.turn.them .bubble{background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:5px}
.turn.me .bubble{background:var(--accent);color:#fff;border:1px solid var(--accent);border-bottom-right-radius:5px}
.bubble .who{font-size:.76rem;font-weight:700;opacity:.75;margin-bottom:.15rem}
.turn.me .bubble .who{color:#eafffd}
.support-tabs{display:flex;gap:.4rem;margin:.6rem 0}
.support-tabs button{flex:1;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;color:var(--ink)}
.support-tabs button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Settings rows */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.8rem 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.setrow:last-child{border-bottom:0}
select,.setrow select{min-height:44px;font-size:1rem;padding:.4rem .6rem;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.switch{min-height:44px}
.recstate{display:inline-flex;align-items:center;gap:.5rem;font-weight:700;color:var(--accent-2)}
.rec-dot{width:14px;height:14px;border-radius:50%;background:var(--accent-2)}
@keyframes pulse{50%{opacity:.35}}
body:not([data-motion="reduce"]) .rec-dot.on{animation:pulse 1s infinite}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:.8rem 1.2rem;border-radius:12px;max-width:90%;z-index:50;box-shadow:var(--shadow)}

/* Responsive: laptop first, phone layer. Core screens survive 200% zoom without horizontal scroll. */
@media (min-width:640px){
  .options{grid-template-columns:1fr 1fr}
}
@media (max-width:639px){
  .container{padding:.8rem .8rem 4rem}
  .appbar{flex-wrap:wrap;gap:.4rem}
  .appbar nav{width:100%;justify-content:space-between}
  .navbtn{flex:1;padding:.4rem .3rem;font-size:.85rem}
  h1{font-size:1.45rem}
  .wordcard .en{font-size:1.7rem}
  .bubble{max-width:100%}
  .btn-row .btn{flex:1}
}
@media (max-width:380px){
  :root{--fs:19px}
  .navbtn{font-size:.8rem}
}
/* High-contrast / forced colours friendliness */
@media (prefers-contrast:more){
  :root{--line:#8a7d64;--ink-soft:#332e26}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}

</style>
</head>

Could you write it down, please?","Please write it for me."],"dialoguePlacements":[],"needsReview":true},{"id":"chunk_rp_isthisright","intention":"check understanding","en":"Is this right?","hu":"Ez így jó?","register":"neutral","firstLesson":"u11-l01","variants":["Am I correct?"],"slots":[],"acceptedForms":["Is this right?","Am I correct?"],"dialoguePlacements":[],"needsReview":true},{"id":"chunk_rp_onemoment","intention":"ask for a moment","en":"Just a moment, please.","hu":"Egy pillanat, kérem.","register":"polite","firstLesson":"u07-l01","variants":["One second, please."],"slots":[],"acceptedForms":["Just a moment, please.","One second, please."],"dialoguePlacements":[],"needsReview":true}],"grammar":[{"id":"gr_be","unitId":"u01","title":{"en":"The verb 'be'","hu":"A 'be' (lenni) ige"},"purpose":{"en":"Say who and what someone is."},"explanation":{"en":"Use am with I, is with he/she/it, are with you/we/they. Short forms: I'm, you're, he's.","hu":"Az I mellett am, a he/she/it mellett is, a you/we/they mellett are áll. Rövid alakok: I'm, you're, he's."},"examples":[{"en":"I am Marta.","hu":"Marta vagyok."},{"en":"She is my niece.","hu":"Ő az unokahúgom."},{"en":"We are from Hungary.","hu":"Magyarországról jövünk."}],"useWhen":{"en":"Use this when you introduce yourself or describe people."},"check":{"question":"Choose: I ___ happy. (am / is)","answer":"am"},"appearsIn":[],"needsReview":true},{"id":"gr_pronouns","unitId":"u01","title":{"en":"Subject pronouns","hu":"Alanyi névmások"},"purpose":{"en":"Say who does something."},"explanation":{"en":"I, you, he, she, it, we, they replace names. Use he for a man, she for a woman.","hu":"Az I, you, he, she, it, we, they a nevek helyett áll. He = férfi, she = nő."},"examples":[{"en":"He is Spanish.","hu":"Ő spanyol."},{"en":"They live in Denmark.","hu":"Ők Dániában élnek."}],"useWhen":{"en":"Use this to talk about other people."},"check":{"question":"Endika is a man. He or she?","answer":"he"},"appearsIn":[],"needsReview":true},{"id":"gr_questions_wh","unitId":"u01","title":{"en":"Question words","hu":"Kérdőszavak"},"purpose":{"en":"Ask for information."},"explanation":{"en":"What asks about things, Where about places, How about the way. The verb comes after the question word.","hu":"A what dolgokra, a where helyre, a how módra kérdez. A kérdőszó után jön az ige."},"examples":[{"en":"What is your name?","hu":"Hogy hívnak?"},{"en":"Where are you from?","hu":"Honnan jössz?"},{"en":"How are you?","hu":"Hogy vagy?"}],"useWhen":{"en":"Use this to start a conversation with questions."},"check":{"question":"___ are you from? (What / Where)","answer":"Where"},"appearsIn":[],"needsReview":true},{"id":"gr_articles","unitId":"u01","title":{"en":"a / an","hu":"a / an (egy)"},"purpose":{"en":"Talk about one thing."},"explanation":{"en":"Use a before a consonant sound, an before a vowel sound: a teacher, an apple.","hu":"Mássalhangzó előtt a, magánhangzó előtt an: a teacher, an apple."},"examples":[{"en":"I am a teacher.","hu":"Tanár vagyok."},{"en":"It is an apple.","hu":"Ez egy alma."}],"useWhen":{"en":"Use this with jobs and single things."},"check":{"question":"___ egg (a / an)","answer":"an"},"appearsIn":[],"needsReview":true},{"id":"gr_possadj","unitId":"u02","title":{"en":"Possessive adjectives","hu":"Birtokos névmások"},"purpose":{"en":"Say whose something is."},"explanation":{"en":"my, your, his, her, our, their show who owns something. His for a man, her for a woman.","hu":"A my, your, his, her, our, their megmutatja, kié valami. His = férfié, her = nőé."},"examples":[{"en":"This is my family.","hu":"Ez az én családom."},{"en":"Her name is Kira.","hu":"Az ő neve Kira."}],"useWhen":{"en":"Use this to talk about your family and things."},"check":{"question":"Kira is a woman. ___ name. (his / her)","answer":"her"},"appearsIn":[],"needsReview":true},{"id":"gr_poss_s","unitId":"u02","title":{"en":"Possessive 's","hu":"Birtokos 's"},"purpose":{"en":"Show that something belongs to a person."},"explanation":{"en":"Add 's to a name: Kira's boyfriend = the boyfriend of Kira.","hu":"Tegyél 's-t a név után: Kira's boyfriend = Kira barátja."},"examples":[{"en":"Endika is Kira's boyfriend.","hu":"Endika Kira barátja."},{"en":"This is Marta's house.","hu":"Ez Marta háza."}],"useWhen":{"en":"Use this to say who someone belongs to in the family."},"check":{"question":"the sister of Marta = Marta___ sister","answer":"'s"},"appearsIn":[],"needsReview":true},{"id":"gr_have","unitId":"u02","title":{"en":"have / has","hu":"have / has (van neki)"},"purpose":{"en":"Say what people have."},"explanation":{"en":"Use have with I/you/we/they and has with he/she/it.","hu":"Az I/you/we/they mellett have, a he/she/it mellett has áll."},"examples":[{"en":"I have two sisters.","hu":"Két nővérem van."},{"en":"She has a nice house.","hu":"Szép háza van."}],"useWhen":{"en":"Use this to talk about family and things you own."},"check":{"question":"He ___ a brother. (have / has)","answer":"has"},"appearsIn":[],"needsReview":true},{"id":"gr_plural","unitId":"u02","title":{"en":"Plural nouns","hu":"Többes szám"},"purpose":{"en":"Talk about more than one."},"explanation":{"en":"Add -s for more than one: one sister, two sisters. Some words change: child → children.","hu":"Több dologhoz tegyél -s-t: one sister, two sisters. Néhány szó változik: child → children."},"examples":[{"en":"I have three brothers.","hu":"Három bátyám van."},{"en":"Two coffees, please.","hu":"Két kávét kérek."}],"useWhen":{"en":"Use this to count people and things."},"check":{"question":"one book, two ___","answer":"books"},"appearsIn":[],"needsReview":true},{"id":"gr_presentsimple","unitId":"u04","title":{"en":"Present simple","hu":"Egyszerű jelen"},"purpose":{"en":"Talk about routines and facts."},"explanation":{"en":"Use the base verb: I get up, they work. Add -s for he/she/it: she works.","hu":"Alap ige: I get up, they work. He/she/it mellett -s: she works."},"examples":[{"en":"I get up at seven.","hu":"Hétkor kelek."},{"en":"She works in Belgium.","hu":"Belgiumban dolgozik."}],"useWhen":{"en":"Use this to describe your day."},"check":{"question":"She ___ (work) every day.","answer":"works"},"appearsIn":[],"needsReview":true},{"id":"gr_dodoes","unitId":"u04","title":{"en":"do / does questions","hu":"do / does kérdések"},"purpose":{"en":"Ask about routines."},"explanation":{"en":"Use Do you...? and Does he/she...? Do not add -s to the main verb: Does she work?","hu":"Do you...? és Does he/she...? A fő igéhez ne tegyél -s-t: Does she work?"},"examples":[{"en":"Do you like coffee?","hu":"Szereted a kávét?"},{"en":"Does she live here?","hu":"Itt lakik?"}],"useWhen":{"en":"Use this to ask people about their routines."},"check":{"question":"___ you like tea? (Do / Does)","answer":"Do"},"appearsIn":[],"needsReview":true},{"id":"gr_frequency","unitId":"u04","title":{"en":"always, usually, sometimes, never","hu":"gyakorisági határozók"},"purpose":{"en":"Say how often something happens."},"explanation":{"en":"These words usually come before the main verb: I always drink coffee.","hu":"Ezek a szavak általában a fő ige előtt állnak: I always drink coffee."},"examples":[{"en":"I usually get up early.","hu":"Általában korán kelek."},{"en":"She never eats meat.","hu":"Soha nem eszik húst."}],"useWhen":{"en":"Use this to describe habits."},"check":{"question":"Word order: I / coffee / drink / always → ?","answer":"I always drink coffee"},"appearsIn":[],"needsReview":true},{"id":"gr_thereis","unitId":"u04","title":{"en":"there is / there are","hu":"there is / there are (van / vannak)"},"purpose":{"en":"Say what exists in a place."},"explanation":{"en":"There is for one thing, there are for more than one: There is a garden. There are two rooms.","hu":"Egy dologhoz there is, többhöz there are: There is a garden. There are two rooms."},"examples":[{"en":"There is a kitchen.","hu":"Van egy konyha."},{"en":"There are two bedrooms.","hu":"Két hálószoba van."}],"useWhen":{"en":"Use this to describe your home."},"check":{"question":"___ three chairs. (There is / There are)","answer":"There are"},"appearsIn":[],"needsReview":true},{"id":"gr_someany","unitId":"u05","title":{"en":"some / any","hu":"some / any"},"purpose":{"en":"Talk about amounts."},"explanation":{"en":"Use some in positive sentences, any in questions and negatives: I have some bread. Do you have any milk?","hu":"Állításban some, kérdésben/tagadásban any: I have some bread. Do you have any milk?"},"examples":[{"en":"I'd like some water.","hu":"Kérnék egy kis vizet."},{"en":"Is there any coffee?","hu":"Van kávé?"}],"useWhen":{"en":"Use this when you shop and cook."},"check":{"question":"Do you have ___ tea? (some / any)","answer":"any"},"appearsIn":[],"needsReview":true},{"id":"gr_wouldlike","unitId":"u05","title":{"en":"I'd like","hu":"Kérnék (I'd like)"},"purpose":{"en":"Ask politely for something."},"explanation":{"en":"I'd like = I would like. It is more polite than I want.","hu":"I'd like = I would like. Udvariasabb, mint az I want."},"examples":[{"en":"I'd like a coffee, please.","hu":"Kérnék egy kávét."},{"en":"I'd like the soup.","hu":"A levest kérném."}],"useWhen":{"en":"Use this in restaurants and shops."},"check":{"question":"Polite: I ___ a tea, please.","answer":"I'd like"},"appearsIn":[],"needsReview":true},{"id":"gr_can","unitId":"u06","title":{"en":"can / can't","hu":"can / can't (tud / nem tud)"},"purpose":{"en":"Talk about ability and possibility."},"explanation":{"en":"Can + base verb: I can swim. Can't = cannot. Questions: Can you help me?","hu":"Can + alap ige: I can swim. Can't = cannot. Kérdés: Can you help me?"},"examples":[{"en":"I can cook.","hu":"Tudok főzni."},{"en":"Can you help me?","hu":"Tudsz segíteni?"}],"useWhen":{"en":"Use this to ask for help and say what you can do."},"check":{"question":"___ you swim? (Can / Do)","answer":"Can"},"appearsIn":[],"needsReview":true},{"id":"gr_goingto","unitId":"u06","title":{"en":"going to (plans)","hu":"going to (tervek)"},"purpose":{"en":"Talk about future plans."},"explanation":{"en":"be + going to + verb: I am going to visit Kira.","hu":"be + going to + ige: I am going to visit Kira."},"examples":[{"en":"I'm going to travel to Prague.","hu":"Prágába fogok utazni."},{"en":"We are going to cook dinner.","hu":"Vacsorát fogunk főzni."}],"useWhen":{"en":"Use this to talk about your plans."},"check":{"question":"I ___ going to call her. (am / do)","answer":"am"},"appearsIn":[],"needsReview":true},{"id":"gr_presentcont","unitId":"u06","title":{"en":"Present continuous","hu":"Folyamatos jelen"},"purpose":{"en":"Talk about now."},"explanation":{"en":"be + verb+ing for actions happening now: I am cooking. She is working.","hu":"be + ige+ing a most történő cselekvésre: I am cooking. She is working."},"examples":[{"en":"I am reading a book.","hu":"Könyvet olvasok éppen."},{"en":"They are watching a film.","hu":"Filmet néznek éppen."}],"useWhen":{"en":"Use this to say what is happening right now."},"check":{"question":"Right now I ___ (cook).","answer":"am cooking"},"appearsIn":[],"needsReview":true},{"id":"gr_prepositions_time","unitId":"u06","title":{"en":"at / on / in (time)","hu":"at / on / in (idő)"},"purpose":{"en":"Say when something happens."},"explanation":{"en":"at for times (at seven), on for days (on Monday), in for months (in July).","hu":"at időpontra (at seven), on napra (on Monday), in hónapra (in July)."},"examples":[{"en":"The lesson is at ten.","hu":"Az óra tízkor van."},{"en":"I'm free on Saturday.","hu":"Szombaton ráérek."}],"useWhen":{"en":"Use this to make plans."},"check":{"question":"___ Monday (at / on / in)","answer":"on"},"appearsIn":[],"needsReview":true},{"id":"gr_object_pronouns","unitId":"u07","title":{"en":"Object pronouns","hu":"Tárgyi névmások"},"purpose":{"en":"Replace the person you talk about."},"explanation":{"en":"me, you, him, her, it, us, them come after the verb: Can you hear me?","hu":"me, you, him, her, it, us, them az ige után áll: Can you hear me?"},"examples":[{"en":"Can you hear me?","hu":"Hallasz engem?"},{"en":"I like him.","hu":"Kedvelem őt."}],"useWhen":{"en":"Use this on phone and video calls."},"check":{"question":"Can you hear ___? (I / me)","answer":"me"},"appearsIn":[],"needsReview":true},{"id":"gr_likeing","unitId":"u08","title":{"en":"like + -ing","hu":"like + -ing"},"purpose":{"en":"Talk about activities you enjoy."},"explanation":{"en":"like/love/enjoy + verb+ing: I like cooking. She loves reading.","hu":"like/love/enjoy + ige+ing: I like cooking. She loves reading."},"examples":[{"en":"I love cooking.","hu":"Imádok főzni."},{"en":"He enjoys swimming.","hu":"Élvez úszni."}],"useWhen":{"en":"Use this to talk about hobbies."},"check":{"question":"I like ___ (read).","answer":"reading"},"appearsIn":[],"needsReview":true},{"id":"gr_imperatives","unitId":"u09","title":{"en":"Imperatives","hu":"Felszólítás"},"purpose":{"en":"Give a simple instruction."},"explanation":{"en":"Use the base verb alone: Turn left. Wait here. Add please to be polite.","hu":"Csak az alap ige: Turn left. Wait here. Udvariasan: tegyél please-t."},"examples":[{"en":"Turn right at the corner.","hu":"A saroknál fordulj jobbra."},{"en":"Please wait a moment.","hu":"Kérlek, várj egy pillanatot."}],"useWhen":{"en":"Use this to give and understand directions."},"check":{"question":"Give a direction: ___ left. (Turn / Turning)","answer":"Turn"},"appearsIn":[],"needsReview":true},{"id":"gr_could_requests","unitId":"u10","title":{"en":"Could you...? / Could I...?","hu":"Could you...? / Could I...?"},"purpose":{"en":"Make polite requests."},"explanation":{"en":"Could you help me? asks someone to do something. Could I have...? asks for something for yourself.","hu":"Could you help me? = kérsz vkit vmire. Could I have...? = kérsz magadnak vmit."},"examples":[{"en":"Could you help me, please?","hu":"Tudna segíteni, kérem?"},{"en":"Could I have some water?","hu":"Kaphatnék egy kis vizet?"}],"useWhen":{"en":"Use this in shops, hotels and on the plane."},"check":{"question":"Polite request for water: Could I ___ some water?","answer":"have"},"appearsIn":[],"needsReview":true},{"id":"gr_waswere","unitId":"u12","title":{"en":"was / were","hu":"was / were (volt)"},"purpose":{"en":"Talk about the past with 'be'."},"explanation":{"en":"was with I/he/she/it, were with you/we/they: I was at home. They were happy.","hu":"was: I/he/she/it, were: you/we/they. I was at home. They were happy."},"examples":[{"en":"I was at my sister's house.","hu":"A nővérem házában voltam."},{"en":"The weather was nice.","hu":"Szép idő volt."}],"useWhen":{"en":"Use this to talk about yesterday."},"check":{"question":"They ___ happy. (was / were)","answer":"were"},"appearsIn":[],"needsReview":true},{"id":"gr_pastsimple","unitId":"u12","title":{"en":"Past simple","hu":"Egyszerű múlt"},"purpose":{"en":"Talk about finished actions."},"explanation":{"en":"Add -ed to many verbs: visited, cooked. Some change: go → went, have → had, see → saw.","hu":"Sok igéhez -ed: visited, cooked. Néhány változik: go → went, have → had, see → saw."},"examples":[{"en":"I visited my sister.","hu":"Meglátogattam a nővéremet."},{"en":"We went to Prague.","hu":"Prágába mentünk."}],"useWhen":{"en":"Use this to tell a short story about the past."},"check":{"question":"Yesterday I ___ (visit) Kira.","answer":"visited"},"appearsIn":[],"needsReview":true},{"id":"gr_needhaveto","unitId":"u13","title":{"en":"need to / have to","hu":"need to / have to (kell)"},"purpose":{"en":"Say what is necessary."},"explanation":{"en":"need to / have to + base verb: I need to pack. I have to check in.","hu":"need to / have to + alap ige: I need to pack. I have to check in."},"examples":[{"en":"I need to buy a ticket.","hu":"Jegyet kell vennem."},{"en":"We have to be early.","hu":"Korán kell odaérnünk."}],"useWhen":{"en":"Use this to plan a trip."},"check":{"question":"I ___ to pack. (need / needs)","answer":"need"},"appearsIn":[],"needsReview":true},{"id":"gr_comparatives","unitId":"u08","title":{"en":"Comparing: -er / more","hu":"Összehasonlítás: -er / more"},"purpose":{"en":"Compare two things in a simple way."},"explanation":{"en":"Short words add -er: older, bigger. Long words use more: more interesting. Use 'than' to compare.","hu":"Rövid szóhoz -er: older, bigger. Hosszú szóhoz more: more interesting. A 'than' köti össze."},"examples":[{"en":"My sister is older than me.","hu":"A nővérem idősebb nálam."},{"en":"This book is more interesting.","hu":"Ez a könyv érdekesebb."}],"useWhen":{"en":"Use this to compare people, places and things."},"check":{"question":"big → ___ (comparative)","answer":"bigger"},"appearsIn":[],"needsReview":true},{"id":"gr_conjunctions","unitId":"u03","title":{"en":"and, but, because","hu":"and, but, because"},"purpose":{"en":"Join your ideas."},"explanation":{"en":"and adds, but shows a difference, because gives a reason.","hu":"and hozzáad, but ellentétet mutat, because okot ad."},"examples":[{"en":"I like tea but I don't like coffee.","hu":"Szeretem a teát, de a kávét nem."},{"en":"I'm happy because you're here.","hu":"Boldog vagyok, mert itt vagy."}],"useWhen":{"en":"Use this to make longer sentences."},"check":{"question":"I'm tired ___ I worked a lot. (but / because)","answer":"because"},"appearsIn":[],"needsReview":true}],"pronunciation":{"path":{"intro":{"en":"We learn pronunciation in two steps. First we listen to the sounds of English, using easy example words — no strange symbols. Then we look at how English spelling and sound fit together, which is the tricky part.","hu":"A kiejtést két lépésben tanuljuk. Először meghallgatjuk az angol hangokat egyszerű példaszavakkal — furcsa jelek nélkül. Utána megnézzük, hogyan illik össze az angol írás és kiejtés — ez a nehéz rész."},"stages":[{"id":"stage-1","label":{"en":"Step 1 · The sounds","hu":"1. lépés · A hangok"}},{"id":"stage-2","label":{"en":"Step 2 · Spelling & sound","hu":"2. lépés · Írás és kiejtés"}},{"id":"stage-3","label":{"en":"Step 3 · Stress & melody","hu":"3. lépés · Hangsúly és dallam"}}]},"spellingFamilies":[{"id":"sf_magic_e_a","stage":"stage-2","order":1,"label":{"en":"The a…e pattern (say the letter A)","hu":"Az a…e minta (az A betű neve)"},"note":{"en":"A silent 'e' at the end often makes 'a' say its name: make, name, late.","hu":"A szóvégi néma 'e' miatt az 'a' gyakran a saját nevét mondja: make, name, late."},"caution":null,"items":[{"onset":"m","rime":"ake","word":"make","tts":"make"},{"onset":"c","rime":"ake","word":"cake","tts":"cake"},{"onset":"n","rime":"ame","word":"name","tts":"name"},{"onset":"g","rime":"ame","word":"game","tts":"game"},{"onset":"l","rime":"ate","word":"late","tts":"late"},{"onset":"pl","rime":"ane","word":"plane","tts":"plane"}]},{"id":"sf_magic_e_i","stage":"stage-2","order":2,"label":{"en":"The i…e pattern (say the letter I)","hu":"Az i…e minta (az I betű neve)"},"note":{"en":"Silent 'e' often makes 'i' say its name: time, five, nice. Careful: give and live are different!","hu":"A néma 'e' miatt az 'i' gyakran a nevét mondja: time, five, nice. Vigyázz: a give és a live más!"},"caution":{"en":"Not always! In give and live the 'i' is short. Spelling does not always tell you the sound.","hu":"Nem mindig! A give és a live szóban az 'i' rövid. Az írás nem mindig árulja el a hangot."},"items":[{"onset":"t","rime":"ime","word":"time","tts":"time"},{"onset":"f","rime":"ive","word":"five","tts":"five"},{"onset":"n","rime":"ice","word":"nice","tts":"nice"},{"onset":"l","rime":"ike","word":"like","tts":"like"},{"onset":"wh","rime":"ite","word":"white","tts":"white"}]},{"id":"sf_magic_e_o","stage":"stage-2","order":3,"label":{"en":"The o…e pattern (say the letter O)","hu":"Az o…e minta (az O betű neve)"},"note":{"en":"Silent 'e' often makes 'o' say its name: home, phone, close.","hu":"A néma 'e' miatt az 'o' gyakran a nevét mondja: home, phone, close."},"caution":null,"items":[{"onset":"h","rime":"ome","word":"home","tts":"home"},{"onset":"ph","rime":"one","word":"phone","tts":"phone"},     go: function (path) { if (("#" + path) === location.hash) route(); else location.hash = path; },
    refresh: function () { route(); },
    mountScreen: function (fn) { dom.clear(main); fn(main); main.focus(); },
  };
})(window.M);


/* ===== app/main.js ===== */
// Bootstrap: wire data indexes, apply settings, init audio, start router.
window.M = window.M || {};
(function (M) {
  function indexData() {
    var D = M.data;
    D._lexById = {}; D._lexByWord = {};
    D.lexicon.forEach(function (l) { D._lexById[l.id] = l; D._lexByWord[l.headword] = l; });
    D._chunkById = {}; D.chunks.forEach(function (c) { D._chunkById[c.id] = c; });
    D._grammarById = {}; D.grammar.forEach(function (g) { D._grammarById[g.id] = g; });
    D._dlgById = {}; D.dialogues.forEach(function (d) { D._dlgById[d.id] = d; });
  }

  function applySettings() {
    var s = M.store.settings();
    document.body.dataset.textsize = s.textSize || "normal";
    document.body.dataset.motion = s.reduceMotion ? "reduce" : "";
    document.documentElement.lang = "en";
  }

  M.boot = function () {
    if (!window.MARTA_DATA || !window.MARTA_I18N) {
      document.body.innerHTML = '<p style="padding:2rem;font-family:sans-serif">Data failed to load.</p>';
      return;
    }
    M.data = window.MARTA_DATA;
    M.strings = window.MARTA_I18N;
    indexData();
    applySettings();
    M.audio.init();
    M.onVoicesReady = function () {
      // refresh settings screen voice list if open
      if ((location.hash || "").indexOf("settings") >= 0 && M.router) M.router.refresh();
    };
    M.router.start();
    // first-run: send to diagnostic if never done
    if (!M.store.progress().diagnostic && !location.hash) M.router.go("diagnostic");
  };

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", M.boot);
  else M.boot();
})(window.M);

</script>
