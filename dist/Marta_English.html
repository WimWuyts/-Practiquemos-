<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>English with Marta · Angol Martával</title>
<meta name="description" content="A calm, personal English course for Marta. Local-first, private, offline.">
<style>
/* Base design system — warm, adult, calm. Designed for a 70+ learner. */
:root{
  --bg:#faf6ef;            /* warm cream */
  --surface:#ffffff;
  --surface-2:#f3ece0;
  --ink:#241f1a;           /* dark readable text */
  --ink-soft:#4d463d;
  --accent:#2f6b4f;        /* calm green */
  --accent-ink:#ffffff;
  --accent-2:#a8551f;      /* warm supportive terracotta */
  --line:#d9cfbe;
  --good:#2f6b4f;
  --good-bg:#e6f0ea;
  --gentle:#8a5a12;
  --gentle-bg:#fbf0dc;
  --focus:#1b4dd8;
  --radius:16px;
  --shadow:0 2px 10px rgba(60,45,25,.08);
  --tap:48px;
  --font: "Segoe UI", "Helvetica Neue", Arial, system-ui, sans-serif;
  --fs:20px;
}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  line-height:1.6;font-size:1rem;-webkit-text-size-adjust:100%;
}
body[data-textsize="large"]{--fs:23px}
body[data-textsize="xlarge"]{--fs:26px}
body[data-motion="reduce"] *{animation:none !important;transition:none !important}
h1,h2,h3{line-height:1.25;color:var(--ink);margin:0 0 .5rem}
h1{font-size:1.7rem}h2{font-size:1.35rem}h3{font-size:1.15rem}
p{margin:0 0 .8rem}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
button{font-family:inherit}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.container{max-width:920px;margin:0 auto;padding:1rem 1.1rem 4rem}
.hidden{display:none !important}

/* Buttons — always large, always labelled */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  min-height:var(--tap);padding:.7rem 1.3rem;border-radius:12px;
  border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);
  font-size:1.02rem;font-weight:600;cursor:pointer;text-decoration:none;
}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(1px)}
.btn.secondary{background:var(--surface);color:var(--accent);}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.wide{width:100%}
.btn.small{min-height:40px;padding:.4rem .9rem;font-size:.92rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:.7rem;margin:1rem 0}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:1.3rem;margin:0 0 1.1rem}
.card h2{margin-top:0}
.muted{color:var(--ink-soft)}
.pill{display:inline-block;padding:.2rem .7rem;border-radius:999px;background:var(--surface-2);
  font-size:.82rem;color:var(--ink-soft);border:1px solid var(--line)}

/* Header / navigation */
.appbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:.8rem;padding:.6rem 1rem}
.appbar .brand{display:flex;align-items:center;gap:.6rem;font-weight:700}
.appbar .brand svg{width:40px;height:40px;flex:0 0 auto}
.appbar .spacer{flex:1}
.appbar nav{display:flex;gap:.3rem;flex-wrap:wrap}
.navbtn{min-height:44px;padding:.4rem .8rem;border-radius:10px;border:1px solid transparent;
  background:transparent;color:var(--ink);font-size:.95rem;cursor:pointer;font-weight:600}
.navbtn[aria-current="page"]{background:var(--good-bg);border-color:var(--accent);color:var(--accent)}
.navbtn:hover{background:var(--surface-2)}

/* Avatar */
.avatar{width:96px;height:96px;border-radius:50%;background:var(--surface-2);border:2px solid var(--line);flex:0 0 auto}
.avatar.small{width:52px;height:52px}
.avatar-row{display:flex;align-items:center;gap:1rem;margin-bottom:1rem}

/* Progress */
.progress{height:16px;background:var(--surface-2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.progress > span{display:block;height:100%;background:var(--accent);width:0}
.unit-list{list-style:none;padding:0;margin:0}
.unit{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:.8rem;overflow:hidden}
.unit > button{width:100%;text-align:left;background:transparent;border:0;padding:1rem 1.1rem;cursor:pointer;
  display:flex;align-items:center;gap:.8rem;font-size:1.05rem;font-weight:700;color:var(--ink)}
.unit .lessons{padding:.3rem .9rem 1rem}
.lessonbtn{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:.7rem .9rem;margin:.35rem 0;cursor:pointer;font-size:1rem;color:var(--ink)}
.lessonbtn:hover{background:var(--good-bg)}
.lessonbtn .done{color:var(--good);font-weight:700}
.badge-status{font-size:.78rem;padding:.15rem .55rem;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-soft)}

/* Activity area */
.stage{min-height:220px}
.prompt{font-size:1.15rem;font-weight:600;margin-bottom:1rem}
.wordcard{text-align:center;padding:1.4rem}
.wordcard .en{font-size:2rem;font-weight:800;letter-spacing:.3px}
.wordcard .hu{font-size:1.15rem;color:var(--accent-2);margin-top:.3rem}
.wordcard .ex{margin-top:.8rem;color:var(--ink-soft)}
.options{display:grid;gap:.7rem;grid-template-columns:1fr}
.option{display:flex;align-items:center;gap:.7rem;min-height:var(--tap);padding:.8rem 1rem;border-radius:12px;
  border:2px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.05rem;text-align:left;color:var(--ink)}
.option:hover{border-color:var(--accent);background:var(--good-bg)}
.option.correct{border-color:var(--good);background:var(--good-bg)}
.option.wrong{border-color:var(--gentle);background:var(--gentle-bg)}
.option .mark{margin-left:auto;font-weight:800}
.blocks,.builder{display:flex;flex-wrap:wrap;gap:.5rem;margin:.6rem 0}
.block{min-height:44px;padding:.5rem 1rem;border-radius:10px;border:2px solid var(--accent);background:var(--surface);
  color:var(--ink);cursor:pointer;font-size:1.05rem}
.builder{min-height:56px;border:2px dashed var(--line);border-radius:12px;padding:.6rem;align-items:center}
.builder:empty::before{content:attr(data-empty);color:var(--ink-soft)}
.textin{width:100%;min-height:var(--tap);font-size:1.1rem;padding:.7rem .9rem;border:2px solid var(--line);border-radius:12px;
  background:var(--surface);color:var(--ink)}
.textin:focus{border-color:var(--accent)}

/* Feedback (also uses text + icon, never colour alone) */
.feedback{display:flex;align-items:flex-start;gap:.6rem;padding:.9rem 1rem;border-radius:12px;margin:1rem 0;font-size:1.05rem}
.feedback.good{background:var(--good-bg);border:1px solid var(--good);color:var(--ink)}
.feedback.gentle{background:var(--gentle-bg);border:1px solid var(--gentle);color:var(--ink)}
.feedback svg{flex:0 0 auto;margin-top:2px}

/* Help panel */
.helppanel{background:var(--gentle-bg);border:1px solid var(--gentle);border-radius:12px;padding:.9rem 1rem;margin:1rem 0}
.helppanel h3{color:var(--gentle);font-size:1rem;margin-bottom:.3rem}

/* Conversation */
.chat{display:flex;flex-direction:column;gap:.8rem;margin:1rem 0}
.bubble{max-width:85%;padding:.8rem 1rem;border-radius:16px;font-size:1.08rem}
.bubble.them{background:var(--surface-2);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.bubble.me{background:var(--good-bg);border:1px solid var(--accent);align-self:flex-end;border-bottom-right-radius:4px}
.bubble .who{font-size:.78rem;font-weight:700;color:var(--ink-soft);margin-bottom:.2rem}
.support-tabs{display:flex;gap:.4rem;margin:.6rem 0}
.support-tabs button{flex:1;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;color:var(--ink)}
.support-tabs button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Settings rows */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.8rem 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.setrow:last-child{border-bottom:0}
select,.setrow select{min-height:44px;font-size:1rem;padding:.4rem .6rem;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.switch{min-height:44px}
.recstate{display:inline-flex;align-items:center;gap:.5rem;font-weight:700;color:var(--accent-2)}
.rec-dot{width:14px;height:14px;border-radius:50%;background:var(--accent-2)}
@keyframes pulse{50%{opacity:.35}}
body:not([data-motion="reduce"]) .rec-dot.on{animation:pulse 1s infinite}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:.8rem 1.2rem;border-radius:12px;max-width:90%;z-index:50;box-shadow:var(--shadow)}

/* Responsive: laptop first, phone layer. Core screens survive 200% zoom without horizontal scroll. */
@media (min-width:640px){
  .options{grid-template-columns:1fr 1fr}
}
@media (max-width:639px){
  .container{padding:.8rem .8rem 4rem}
  .appbar{flex-wrap:wrap;gap:.4rem}
  .appbar nav{width:100%;justify-content:space-between}
  .navbtn{flex:1;padding:.4rem .3rem;font-size:.85rem}
  h1{font-size:1.45rem}
  .wordcard .en{font-size:1.7rem}
  .bubble{max-width:100%}
  .btn-row .btn{flex:1}
}
@media (max-width:380px){
  :root{--fs:19px}
  .navbtn{font-size:.8rem}
}
/* High-contrast / forced colours friendliness */
@media (prefers-contrast:more){
  :root{--line:#8a7d64;--ink-soft:#332e26}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}

</style>
</head>

 am, a he/she/it mellett is, a you/we/they mellett are áll. Rövid alakok: I'm, you're, he's."},"examples":[{"en":"I am Marta.","hu":"Marta vagyok."},{"en":"She is my niece.","hu":"Ő az unokahúgom."},{"en":"We are from Hungary.","hu":"Magyarországról jövünk."}],"useWhen":{"en":"Use this when you introduce yourself or describe people."},"check":{"question":"Choose: I ___ happy. (am / is)","answer":"am"},"appearsIn":[],"needsReview":true},{"id":"gr_pronouns","unitId":"u01","title":{"en":"Subject pronouns","hu":"Alanyi névmások"},"purpose":{"en":"Say who does something."},"explanation":{"en":"I, you, he, she, it, we, they replace names. Use he for a man, she for a woman.","hu":"Az I, you, he, she, it, we, they a nevek helyett áll. He = férfi, she = nő."},"examples":[{"en":"He is Spanish.","hu":"Ő spanyol."},{"en":"They live in Denmark.","hu":"Ők Dániában élnek."}],"useWhen":{"en":"Use this to talk about other people."},"check":{"question":"Endika is a man. He or she?","answer":"he"},"appearsIn":[],"needsReview":true},{"id":"gr_questions_wh","unitId":"u01","title":{"en":"Question words","hu":"Kérdőszavak"},"purpose":{"en":"Ask for information."},"explanation":{"en":"What asks about things, Where about places, How about the way. The verb comes after the question word.","hu":"A what dolgokra, a where helyre, a how módra kérdez. A kérdőszó után jön az ige."},"examples":[{"en":"What is your name?","hu":"Hogy hívnak?"},{"en":"Where are you from?","hu":"Honnan jössz?"},{"en":"How are you?","hu":"Hogy vagy?"}],"useWhen":{"en":"Use this to start a conversation with questions."},"check":{"question":"___ are you from? (What / Where)","answer":"Where"},"appearsIn":[],"needsReview":true},{"id":"gr_articles","unitId":"u01","title":{"en":"a / an","hu":"a / an (egy)"},"purpose":{"en":"Talk about one thing."},"explanation":{"en":"Use a before a consonant sound, an before a vowel sound: a teacher, an apple.","hu":"Mássalhangzó előtt a, magánhangzó előtt an: a teacher, an apple."},"examples":[{"en":"I am a teacher.","hu":"Tanár vagyok."},{"en":"It is an apple.","hu":"Ez egy alma."}],"useWhen":{"en":"Use this with jobs and single things."},"check":{"question":"___ egg (a / an)","answer":"an"},"appearsIn":[],"needsReview":true},{"id":"gr_possadj","unitId":"u02","title":{"en":"Possessive adjectives","hu":"Birtokos névmások"},"purpose":{"en":"Say whose something is."},"explanation":{"en":"my, your, his, her, our, their show who owns something. His for a man, her for a woman.","hu":"A my, your, his, her, our, their megmutatja, kié valami. His = férfié, her = nőé."},"examples":[{"en":"This is my family.","hu":"Ez az én családom."},{"en":"Her name is Kira.","hu":"Az ő neve Kira."}],"useWhen":{"en":"Use this to talk about your family and things."},"check":{"question":"Kira is a woman. ___ name. (his / her)","answer":"her"},"appearsIn":[],"needsReview":true},{"id":"gr_poss_s","unitId":"u02","title":{"en":"Possessive 's","hu":"Birtokos 's"},"purpose":{"en":"Show that something belongs to a person."},"explanation":{"en":"Add 's to a name: Kira's boyfriend = the boyfriend of Kira.","hu":"Tegyél 's-t a név után: Kira's boyfriend = Kira barátja."},"examples":[{"en":"Endika is Kira's boyfriend.","hu":"Endika Kira barátja."},{"en":"This is Marta's house.","hu":"Ez Marta háza."}],"useWhen":{"en":"Use this to say who someone belongs to in the family."},"check":{"question":"the sister of Marta = Marta___ sister","answer":"'s"},"appearsIn":[],"needsReview":true},{"id":"gr_have","unitId":"u02","title":{"en":"have / has","hu":"have / has (van neki)"},"purpose":{"en":"Say what people have."},"explanation":{"en":"Use have with I/you/we/they and has with he/she/it.","hu":"Az I/you/we/they mellett have, a he/she/it mellett has áll."},"examples":[{"en":"I have two sisters.","hu":"Két nővérem van."},{"en":"She has a nice house.","hu":"Szép háza van."}],"useWhen":{"en":"Use this to talk about family and things you own."},"check":{"question":"He ___ a brother. (have / has)","answer":"has"},"appearsIn":[],"needsReview":true},{"id":"gr_plural","unitId":"u02","title":{"en":"Plural nouns","hu":"Többes szám"},"purpose":{"en":"Talk about more than one."},"explanation":{"en":"Add -s for more than one: one sister, two sisters. Some words change: child → children.","hu":"Több dologhoz tegyél -s-t: one sister, two sisters. Néhány szó változik: child → children."},"examples":[{"en":"I have three brothers.","hu":"Három bátyám van."},{"en":"Two coffees, please.","hu":"Két kávét kérek."}],"useWhen":{"en":"Use this to count people and things."},"check":{"question":"one book, two ___","answer":"books"},"appearsIn":[],"needsReview":true},{"id":"gr_presentsimple","unitId":"u04","title":{"en":"Present simple","hu":"Egyszerű jelen"},"purpose":{"en":"Talk about routines and facts."},"explanation":{"en":"Use the base verb: I get up, they work. Add -s for he/she/it: she works.","hu":"Alap ige: I get up, they work. He/she/it mellett -s: she works."},"examples":[{"en":"I get up at seven.","hu":"Hétkor kelek."},{"en":"She works in Belgium.","hu":"Belgiumban dolgozik."}],"useWhen":{"en":"Use this to describe your day."},"check":{"question":"She ___ (work) every day.","answer":"works"},"appearsIn":[],"needsReview":true},{"id":"gr_dodoes","unitId":"u04","title":{"en":"do / does questions","hu":"do / does kérdések"},"purpose":{"en":"Ask about routines."},"explanation":{"en":"Use Do you...? and Does he/she...? Do not add -s to the main verb: Does she work?","hu":"Do you...? és Does he/she...? A fő igéhez ne tegyél -s-t: Does she work?"},"examples":[{"en":"Do you like coffee?","hu":"Szereted a kávét?"},{"en":"Does she live here?","hu":"Itt lakik?"}],"useWhen":{"en":"Use this to ask people about their routines."},"check":{"question":"___ you like tea? (Do / Does)","answer":"Do"},"appearsIn":[],"needsReview":true},{"id":"gr_frequency","unitId":"u04","title":{"en":"always, usually, sometimes, never","hu":"gyakorisági határozók"},"purpose":{"en":"Say how often something happens."},"explanation":{"en":"These words usually come before the main verb: I always drink coffee.","hu":"Ezek a szavak általában a fő ige előtt állnak: I always drink coffee."},"examples":[{"en":"I usually get up early.","hu":"Általában korán kelek."},{"en":"She never eats meat.","hu":"Soha nem eszik húst."}],"useWhen":{"en":"Use this to describe habits."},"check":{"question":"Word order: I / coffee / drink / always → ?","answer":"I always drink coffee"},"appearsIn":[],"needsReview":true},{"id":"gr_thereis","unitId":"u04","title":{"en":"there is / there are","hu":"there is / there are (van / vannak)"},"purpose":{"en":"Say what exists in a place."},"explanation":{"en":"There is for one thing, there are for more than one: There is a garden. There are two rooms.","hu":"Egy dologhoz there is, többhöz there are: There is a garden. There are two rooms."},"examples":[{"en":"There is a kitchen.","hu":"Van egy konyha."},{"en":"There are two bedrooms.","hu":"Két hálószoba van."}],"useWhen":{"en":"Use this to describe your home."},"check":{"question":"___ three chairs. (There is / There are)","answer":"There are"},"appearsIn":[],"needsReview":true},{"id":"gr_someany","unitId":"u05","title":{"en":"some / any","hu":"some / any"},"purpose":{"en":"Talk about amounts."},"explanation":{"en":"Use some in positive sentences, any in questions and negatives: I have some bread. Do you have any milk?","hu":"Állításban some, kérdésben/tagadásban any: I have some bread. Do you have any milk?"},"examples":[{"en":"I'd like some water.","hu":"Kérnék egy kis vizet."},{"en":"Is there any coffee?","hu":"Van kávé?"}],"useWhen":{"en":"Use this when you shop and cook."},"check":{"question":"Do you have ___ tea? (some / any)","answer":"any"},"appearsIn":[],"needsReview":true},{"id":"gr_wouldlike","unitId":"u05","title":{"en":"I'd like","hu":"Kérnék (I'd like)"},"purpose":{"en":"Ask politely for something."},"explanation":{"en":"I'd like = I would like. It is more polite than I want.","hu":"I'd like = I would like. Udvariasabb, mint az I want."},"examples":[{"en":"I'd like a coffee, please.","hu":"Kérnék egy kávét."},{"en":"I'd like the soup.","hu":"A levest kérném."}],"useWhen":{"en":"Use this in restaurants and shops."},"check":{"question":"Polite: I ___ a tea, please.","answer":"I'd like"},"appearsIn":[],"needsReview":true},{"id":"gr_can","unitId":"u06","title":{"en":"can / can't","hu":"can / can't (tud / nem tud)"},"purpose":{"en":"Talk about ability and possibility."},"explanation":{"en":"Can + base verb: I can swim. Can't = cannot. Questions: Can you help me?","hu":"Can + alap ige: I can swim. Can't = cannot. Kérdés: Can you help me?"},"examples":[{"en":"I can cook.","hu":"Tudok főzni."},{"en":"Can you help me?","hu":"Tudsz segíteni?"}],"useWhen":{"en":"Use this to ask for help and say what you can do."},"check":{"question":"___ you swim? (Can / Do)","answer":"Can"},"appearsIn":[],"needsReview":true},{"id":"gr_goingto","unitId":"u06","title":{"en":"going to (plans)","hu":"going to (tervek)"},"purpose":{"en":"Talk about future plans."},"explanation":{"en":"be + going to + verb: I am going to visit Kira.","hu":"be + going to + ige: I am going to visit Kira."},"examples":[{"en":"I'm going to travel to Prague.","hu":"Prágába fogok utazni."},{"en":"We are going to cook dinner.","hu":"Vacsorát fogunk főzni."}],"useWhen":{"en":"Use this to talk about your plans."},"check":{"question":"I ___ going to call her. (am / do)","answer":"am"},"appearsIn":[],"needsReview":true},{"id":"gr_presentcont","unitId":"u06","title":{"en":"Present continuous","hu":"Folyamatos jelen"},"purpose":{"en":"Talk about now."},"explanation":{"en":"be + verb+ing for actions happening now: I am cooking. She is working.","hu":"be + ige+ing a most történő cselekvésre: I am cooking. She is working."},"examples":[{"en":"I am reading a book.","hu":"Könyvet olvasok éppen."},{"en":"They are watching a film.","hu":"Filmet néznek éppen."}],"useWhen":{"en":"Use this to say what is happening right now."         [el("span", { html: dom.icon(n[2]), "aria-hidden": "true" }), " " + M.i18n.t(n[1])]);
      nav.appendChild(b);
    });
    bar.appendChild(nav);
    document.body.appendChild(bar);
    main = el("main", { class: "container", id: "main", tabindex: "-1" });
    document.body.appendChild(main);
    liveRegion = el("div", { class: "sr-only", "aria-live": "polite" });
    document.body.appendChild(liveRegion);
  }

  function setActive(screen) {
    Array.prototype.forEach.call(document.querySelectorAll(".navbtn"), function (b) {
      b.setAttribute("aria-current", b.dataset.screen === screen ? "page" : "false");
    });
  }

  function route() {
    var hash = (location.hash || "#home").slice(1);
    var parts = hash.split("/");
    var screen = parts[0] || "home";
    current = hash;
    dom.clear(main);
    M.ui.init();
    if (screen === "lesson") { M.ui.lessonRunner(main, parts[1]); setActive("lessons"); }
    else if (screen === "talk") { M.ui.talk(main, parts[1]); setActive("conversations"); }
    else if (M.ui.screens[screen]) { M.ui.screens[screen](main); setActive(screen); }
    else { M.ui.screens.home(main); setActive("home"); }
    main.focus();
    if (liveRegion) liveRegion.textContent = screen;
    window.scrollTo(0, 0);
  }

  M.router = {
    start: function () { buildChrome(); window.addEventListener("hashchange", route); route(); },
    go: function (path) { if (("#" + path) === location.hash) route(); else location.hash = path; },
    refresh: function () { route(); },
    mountScreen: function (fn) { dom.clear(main); fn(main); main.focus(); },
  };
})(window.M);


/* ===== app/main.js ===== */
// Bootstrap: wire data indexes, apply settings, init audio, start router.
window.M = window.M || {};
(function (M) {
  function indexData() {
    var D = M.data;
    D._lexById = {}; D._lexByWord = {};
    D.lexicon.forEach(function (l) { D._lexById[l.id] = l; D._lexByWord[l.headword] = l; });
    D._chunkById = {}; D.chunks.forEach(function (c) { D._chunkById[c.id] = c; });
    D._grammarById = {}; D.grammar.forEach(function (g) { D._grammarById[g.id] = g; });
    D._dlgById = {}; D.dialogues.forEach(function (d) { D._dlgById[d.id] = d; });
  }

  function applySettings() {
    var s = M.store.settings();
    document.body.dataset.textsize = s.textSize || "normal";
    document.body.dataset.motion = s.reduceMotion ? "reduce" : "";
    document.documentElement.lang = "en";
  }

  M.boot = function () {
    if (!window.MARTA_DATA || !window.MARTA_I18N) {
      document.body.innerHTML = '<p style="padding:2rem;font-family:sans-serif">Data failed to load.</p>';
      return;
    }
    M.data = window.MARTA_DATA;
    M.strings = window.MARTA_I18N;
    indexData();
    applySettings();
    M.audio.init();
    M.onVoicesReady = function () {
      // refresh settings screen voice list if open
      if ((location.hash || "").indexOf("settings") >= 0 && M.router) M.router.refresh();
    };
    M.router.start();
    // first-run: send to diagnostic if never done
    if (!M.store.progress().diagnostic && !location.hash) M.router.go("diagnostic");
  };

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", M.boot);
  else M.boot();
})(window.M);

</script>
